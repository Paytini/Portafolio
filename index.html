<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio de Jordan Jorge Payta Sarabia - Full-Stack Developer especializado en desarrollo web, IA y automatización">
    <title>Jordan Payta - Full-Stack Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="header-include"></div>

    <section class="home section" id="home">
        <div class="home__container container">
            <div class="home__content">
                <div class="home__data">
                    <span class="home__greeting" data-i18n="homeGreeting">Hola, soy</span>
                    <h1 class="home__name" data-i18n="homeName">Jordan Jorge Payta Sarabia</h1>
                    <h3 class="home__profession" data-i18n="homeProfession">Full-Stack Developer & Computer Engineer</h3>
                    <p class="home__description" data-i18n="homeDescription">
                        Desarrollo web, inteligencia artificial y automatización de procesos.
                    </p>
                    <div class="home__buttons">
                        <a href="contact.html" class="button button-primary">
                            <span data-i18n="homeContactBtn">Contáctame</span> <i class="fas fa-paper-plane"></i>
                        </a>
                        <a href="experience.html" class="button button-secondary">
                            <span data-i18n="homeExperienceBtn">Ver Experiencia Laboral</span> <i class="fas fa-arrow-right"></i>
                        </a>
                    </div>

                    <div class="status-badge">
                        <span class="status-dot" aria-hidden="true"></span>
                        <span data-i18n="statusAvailable">Disponible para nuevas oportunidades</span>
                    </div>
                </div>
                <div class="home__image">
                    <div class="home__frame">
                        <span class="corner corner--tl" aria-hidden="true"></span>
                        <span class="corner corner--tr" aria-hidden="true"></span>
                        <span class="corner corner--bl" aria-hidden="true"></span>
                        <span class="corner corner--br" aria-hidden="true"></span>
                        <img src="assets/images/profile_pic.webp" alt="Jordan Payta" class="home__img" width="640" height="722" fetchpriority="high" decoding="async">
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div id="footer-include"></div>

    <script defer src="js/translations.js"></script>
    <script defer src="js/script.js"></script>
</body>
</html>
